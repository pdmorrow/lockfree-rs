[package]
name = "spinlock-rs"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "spinlock"
harness = false

# Not a criterion target: a fixed-window measurement that prints a
# table. See its module docs for why fairness cannot be a benchmark.
[[bench]]
name = "fairness"
harness = false

# Not a criterion target either: one lock, one configuration, one
# process, so a hardware counter attached to it measures that and
# nothing else. Driven by scripts/perf.sh.
[[bench]]
name = "perf"
harness = false

# Benchmarks are only meaningful with optimisations on; `cargo bench`
# uses this profile.
[profile.bench]
debug = true       # keep symbols so `perf` can attribute samples
lto = "thin"
codegen-units = 1
